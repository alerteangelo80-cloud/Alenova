<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALENOVA Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial,sans-serif;background:#f3f5f8;margin:0;padding:18px;color:#172033}
main{max-width:700px;margin:auto}
section{background:white;padding:20px;border-radius:12px;margin:15px 0}
input,select,textarea,button{width:100%;padding:13px;margin:8px 0;box-sizing:border-box;border:1px solid #ccc;border-radius:7px;font-size:16px}
textarea{min-height:85px;resize:vertical}
button{background:#087b55;color:white;border:0;font-weight:bold;cursor:pointer}
button.secondary{background:#3566a8}
button.danger{background:#b83232}
.product,.service{border:1px solid #ddd;padding:12px;margin:12px 0;border-radius:8px}
.product img{width:100%;max-height:220px;object-fit:contain}
.hidden{display:none}
.status{font-weight:bold}
</style>
</head>
<body>
<main>
<h1>ALENOVA | Administrasyon</h1>

<section id="login">
<h2>Konekte</h2>
<input id="email" type="email" placeholder="Imèl administratè">
<input id="password" type="password" placeholder="Modpas">
<button onclick="login()">Konekte</button>
<p id="loginMsg"></p>
</section>

<section id="dashboard" class="hidden">

<h2>Ajoute yon pwodwi</h2>

<label>Non pwodwi a</label>
<input id="name" placeholder="Ekri non pwodwi a">

<label>Pri an detay</label>
<input id="retail" type="number" min="0" step="0.01" placeholder="Pri an detay">

<label>Chwazi lajan an</label>
<select id="currency">
<option value="HTG">Goud ayisyen (HTG)</option>
<option value="USD">Dola ameriken (USD)</option>
</select>

<label>Foto pwodwi a</label>
<input id="photo" type="file" accept="image/*">

<button onclick="addProduct()">Ajoute pwodwi</button>
<p id="message"></p>

<h2>Pwodwi yo</h2>
<div id="products"></div>

<hr>

<h2>Ajoute yon sèvis</h2>

<label>Non sèvis la</label>
<input id="serviceName" placeholder="Egzanp: Konsepsyon logo">

<label>Deskripsyon sèvis la</label>
<textarea id="serviceDescription" placeholder="Dekri sèvis la..."></textarea>

<label>Pri sèvis la (si genyen)</label>
<input id="servicePrice" type="number" min="0" step="0.01" placeholder="Kite vid si pri a pa fiks">

<label>Lajan</label>
<select id="serviceCurrency">
<option value="HTG">Goud ayisyen (HTG)</option>
<option value="USD">Dola ameriken (USD)</option>
</select>

<button onclick="addService()">Ajoute sèvis</button>
<p id="serviceMessage"></p>

<h2>Sèvis yo</h2>
<div id="services"></div>

<button onclick="logout()">Dekonekte</button>
</section>
</main>

<script>
const SUPABASE_URL = "https://xnzwfnbyasbkjrjspfgc.supabase.co";
const SUPABASE_KEY = "sb_publishable_lqjWc7srUJbH3x7MQiHXHA_o3AwqrUa";

const db = window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

async function login(){
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 const msg=document.getElementById("loginMsg");

 const {error}=await db.auth.signInWithPassword({email,password});

 if(error){
  msg.textContent="Erè koneksyon: "+error.message;
  return;
 }

 await checkAdmin();
}

async function checkAdmin(){
 const {data:{user}}=await db.auth.getUser();
 if(!user)return;

 const {data,error}=await db.from("admin_users")
 .select("user_id")
 .eq("user_id",user.id)
 .maybeSingle();

 if(error || !data){
  document.getElementById("loginMsg").textContent="Kont sa a pa gen dwa administratè.";
  await db.auth.signOut();
  return;
 }

 document.getElementById("login").classList.add("hidden");
 document.getElementById("dashboard").classList.remove("hidden");

 await loadProducts();
 await loadServices();
}

/* PWODWI */

async function addProduct(){
 const name=document.getElementById("name").value.trim();
 const retailInput=document.getElementById("retail").value;
 const retail=Number(retailInput);
 const currency=document.getElementById("currency").value;
 const file=document.getElementById("photo").files[0];
 const msg=document.getElementById("message");

 if(!name || retailInput==="" || !file){
  msg.textContent="Tanpri ranpli tout chan yo epi chwazi yon foto.";
  return;
 }

 if(retail<0){
  msg.textContent="Pri a pa ka negatif.";
  return;
 }

 msg.textContent="Ap ajoute pwodwi a...";

 const ext=file.name.split(".").pop().toLowerCase();
 const path=crypto.randomUUID()+"."+ext;

 const {error:uploadError}=await db.storage
 .from("product-images")
 .upload(path,file);

 if(uploadError){
  msg.textContent="Pwoblèm ak foto a: "+uploadError.message;
  return;
 }

 const {data:urlData}=db.storage
 .from("product-images")
 .getPublicUrl(path);

 const {error}=await db.from("products").insert({
  name:name,
  retail_price:retail,
  currency:currency,
  image_url:urlData.publicUrl
 });

 if(error){
  msg.textContent="Pwoblèm pandan anrejistreman: "+error.message;
  return;
 }

 msg.textContent="Pwodwi a ajoute avèk siksè!";

 document.getElementById("name").value="";
 document.getElementById("retail").value="";
 document.getElementById("photo").value="";
 document.getElementById("currency").value="HTG";

 await loadProducts();
}

async function loadProducts(){
 const area=document.getElementById("products");
 area.textContent="Ap chaje pwodwi yo...";

 const {data,error}=await db.from("products")
 .select("*")
 .order("id",{ascending:false});

 if(error){
  area.textContent="Erè: "+error.message;
  return;
 }

 area.innerHTML="";

 if(!data || data.length===0){
  area.textContent="Pa gen pwodwi pou kounye a.";
  return;
 }

 data.forEach(p=>{
  const div=document.createElement("div");
  div.className="product";

  if(p.image_url){
   const img=document.createElement("img");
   img.src=p.image_url;
   img.alt=p.name;
   div.appendChild(img);
  }

  const title=document.createElement("h3");
  title.textContent=p.name;

  const price=document.createElement("p");
  const symbol=p.currency==="USD"?"USD":"HTG";
  price.textContent="Pri an detay: "+p.retail_price+" "+symbol;

  const del=document.createElement("button");
  del.className="danger";
  del.textContent="Efase pwodwi";
  del.onclick=()=>deleteProduct(p.id);

  div.append(title,price,del);
  area.appendChild(div);
 });
}

async function deleteProduct(id){
 if(!confirm("Èske ou vle efase pwodwi sa a?"))return;

 const {error}=await db.from("products")
 .delete()
 .eq("id",id);

 if(error){
  alert("Erè: "+error.message);
  return;
 }

 await loadProducts();
}

/* SEVIS */

async function addService(){
 const name=document.getElementById("serviceName").value.trim();
 const description=document.getElementById("serviceDescription").value.trim();
 const priceInput=document.getElementById("servicePrice").value;
 const currency=document.getElementById("serviceCurrency").value;
 const msg=document.getElementById("serviceMessage");

 if(!name){
  msg.textContent="Tanpri antre non sèvis la.";
  return;
 }

 if(priceInput!=="" && Number(priceInput)<0){
  msg.textContent="Pri a pa ka negatif.";
  return;
 }

 const price=priceInput===""?null:Number(priceInput);

 msg.textContent="Ap anrejistre sèvis la...";

 const {error}=await db.from("services").insert({
  name:name,
  description:description || null,
  price:price,
  currency:currency,
  active:true
 });

 if(error){
  msg.textContent="Erè: "+error.message;
  return;
 }

 msg.textContent="Sèvis la ajoute avèk siksè!";

 document.getElementById("serviceName").value="";
 document.getElementById("serviceDescription").value="";
 document.getElementById("servicePrice").value="";
 document.getElementById("serviceCurrency").value="HTG";

 await loadServices();
}

async function loadServices(){
 const area=document.getElementById("services");
 area.textContent="Ap chaje sèvis yo...";

 const {data,error}=await db.from("services")
 .select("*")
 .order("id",{ascending:false});

 if(error){
  area.textContent="Erè: "+error.message;
  return;
 }

 area.innerHTML="";

 if(!data || data.length===0){
  area.textContent="Pa gen sèvis pou kounye a.";
  return;
 }

 data.forEach(s=>{
  const div=document.createElement("div");
  div.className="service";

  const title=document.createElement("h3");
  title.textContent=s.name;

  const description=document.createElement("p");
  description.textContent=s.description || "Pa gen deskripsyon.";

  const price=document.createElement("p");
  if(s.price===null){
   price.textContent="Pri: Kontakte nou";
  }else{
   price.textContent="Pri: "+s.price+" "+(s.currency || "HTG");
  }

  const status=document.createElement("p");
  status.className="status";
  status.textContent=s.active?"Estati: Aktif":"Estati: Dezaktive";

  const edit=document.createElement("button");
  edit.className="secondary";
  edit.textContent="Modifye";
  edit.onclick=()=>editService(s);

  const toggle=document.createElement("button");
  toggle.textContent=s.active?"Dezaktive":"Aktive";
  toggle.className="secondary";
  toggle.onclick=()=>toggleService(s);

  const del=document.createElement("button");
  del.className="danger";
  del.textContent="Efase sèvis";
  del.onclick=()=>deleteService(s.id);

  div.append(title,description,price,status,edit,toggle,del);
  area.appendChild(div);
 });
}

async function editService(service){
 const name=prompt("Nouvo non sèvis la:",service.name);
 if(name===null)return;

 if(!name.trim()){
  alert("Non sèvis la obligatwa.");
  return;
 }

 const description=prompt(
  "Nouvo deskripsyon sèvis la:",
  service.description || ""
 );
 if(description===null)return;

 const oldPrice=service.price===null?"":String(service.price);
 const priceInput=prompt(
  "Nouvo pri a. Kite vid si pa gen pri fiks:",
  oldPrice
 );
 if(priceInput===null)return;

 if(priceInput.trim()!=="" && 
   (!Number.isFinite(Number(priceInput)) || Number(priceInput)<0)){
  alert("Pri a pa valab.");
  return;
 }

 const currency=prompt(
  "Ekri HTG oswa USD:",
  service.currency || "HTG"
 );
 if(currency===null)return;

 const cleanCurrency=currency.trim().toUpperCase();

 if(cleanCurrency!=="HTG" && cleanCurrency!=="USD"){
  alert("Ou dwe antre HTG oswa USD.");
  return;
 }

 const {error}=await db.from("services")
 .update({
  name:name.trim(),
  description:description.trim() || null,
  price:priceInput.trim()===""?null:Number(priceInput),
  currency:cleanCurrency
 })
 .eq("id",service.id);

 if(error){
  alert("Erè pandan modifikasyon: "+error.message);
  return;
 }

 alert("Sèvis la modifye avèk siksè!");
 await loadServices();
}

async function toggleService(service){
 const {error}=await db.from("services")
 .update({active:!service.active})
 .eq("id",service.id);

 if(error){
  alert("Erè: "+error.message);
  return;
 }

 await loadServices();
}

async function deleteService(id){
 if(!confirm("Èske ou vle efase sèvis sa a definitivman?"))return;

 const {error}=await db.from("services")
 .delete()
 .eq("id",id);

 if(error){
  alert("Erè: "+error.message);
  return;
 }

 await loadServices();
}

async function logout(){
 await db.auth.signOut();
 location.reload();
}

db.auth.getSession().then(({data})=>{
 if(data.session)checkAdmin();
});
</script>
</body>
</html>
