function tr(key) {
  return translations[currentLang][key] || translations.ht[key] || key;
}

/* CHANJE LANG */
function setLang(lang) {
  if (!translations[lang]) return;

  currentLang = lang;
  document.documentElement.lang = lang;

  document.querySelectorAll("[data-" + lang + "]").forEach(el => {
    const value = el.getAttribute("data-" + lang);
    if (value !== null) el.textContent = value;
  });

  document.querySelectorAll(".lang button").forEach(btn => {
    btn.classList.remove("active");
  });

  const activeButton = document.getElementById(lang + "Btn");
  if (activeButton) activeButton.classList.add("active");

  document.getElementById("welcomeText").textContent = tr("welcome");

  calculate();
  loadFlyers();
  loadPortfolio();
  loadPacks();
}

/* FONKSYON WHATSAPP */
function openWhatsApp(message) {
  const url = "https://wa.me/" + WHATSAPP + "?text=" +
    encodeURIComponent(message);

  window.open(url, "_blank");
}

/* KALKIL ECHANJ */
function calculate() {
  const amountInput = document.getElementById("amount");
  const received = document.getElementById("received");
  const feeText = document.getElementById("fee");

  const amount = Number(amountInput.value);

  if (!amount || amount < 0) {
    received.textContent = "0.00 G";
    feeText.textContent = tr("fee") + ": 0.00 G";
    return;
  }

  const fee = amount * 0.075;
  const result = amount - fee;

  received.textContent = result.toFixed(2) + " G";
  feeText.textContent = tr("fee") + ": " + fee.toFixed(2) + " G";
}

/* VOYE DEMANN ECHANJ */
function submitExchange(event) {
  event.preventDefault();

  const amount = Number(document.getElementById("amount").value);
  const direction = document.getElementById("direction").value;
  const customer = document.getElementById("customerPhone").value.trim();
  const receiver = document.getElementById("receiverPhone").value.trim();

  if (!Number.isFinite(amount) || amount < 50) {
    alert(tr("enterAmount"));
    return;
  }

  if (!customer || !receiver) {
    alert(tr("missing"));
    return;
  }

  const fee = amount * 0.075;
  const result = amount - fee;

  const directionText = direction === "mn"
    ? "MonCash vers Natcash"
    : "Natcash vers MonCash";

  const message =
    tr("exchangeTitle") + "\n\n" +
    tr("direction") + ": " + directionText + "\n" +
    tr("amount") + ": " + amount.toFixed(2) + " G\n" +
    tr("serviceFee") + ": " + fee.toFixed(2) + " G\n" +
    tr("estimated") + ": " + result.toFixed(2) + " G\n" +
    tr("customer") + ": " + customer + "\n" +
    tr("receiver") + ": " + receiver + "\n\n" +
    tr("exchangeNote");

  openWhatsApp(message);
}

async function loadFlyers() {
  const area = document.getElementById("product-list");
  area.innerHTML = '<p class="product-loading">' + tr("loading") + '</p>';

  const { data, error } = await db
    .from("product_flyers")
    .select("id,image_url,active")
    .eq("active", true)
    .order("id", { ascending: true });

  if (error) {
    area.innerHTML = '<p class="product-empty">' + tr("loadError") + '</p>';
    console.error("Flyers:", error.message);
    return;
  }

  area.innerHTML = "";

  if (!data || data.length === 0) {
    area.innerHTML = '<p class="product-empty">' + tr("noFlyers") + '</p>';
    return;
  }

  data.forEach(item => {
    const card = document.createElement("div");
    card.className = "product-card";

    const img = document.createElement("img");
    img.src = item.image_url;
    img.alt = tr("imageAlt");
    img.loading = "lazy";

    const info = document.createElement("div");
    info.className = "product-info";

    const title = document.createElement("h3");
    title.textContent = "ALENOVA";

    const button = document.createElement("a");
    button.className = "btn product-order";
    button.href = "https://wa.me/" + WHATSAPP + "?text=" +
      encodeURIComponent(tr("order") + " ALENOVA");
    button.target = "_blank";
    button.rel = "noopener";
    button.textContent = tr("order");

    info.append(title, button);
    card.append(img, info);
    area.appendChild(card);
  });
}

    const title = document.createElement("h3");
    title.textContent = pack.name || "";

    const description = document.createElement("p");
    description.textContent = pack.description || "";

    const servicesTitle = document.createElement("strong");
    servicesTitle.textContent = tr("packageServices");

    const list = document.createElement("ul");

    (pack.included_services || []).forEach(service => {
      const li = document.createElement("li");
      li.textContent = service;
      list.appendChild(li);
    });

    const button = document.createElement("a");
    button.className = "btn product-order";

    button.rel = "noopener";
    button.textContent = tr("order");

    info.append(title, description, servicesTitle, list, button);
    card.appendChild(info);
    area.appendChild(card);
  });
}
